title = "Ottale e simbolico"
track = "permessi"
man = ["chmod(1)", "stat(1)"]

[[exercises]]
id = "stipendi"
title = "Il file degli stipendi"
kind = "stato"
task = '''
`/srv/esercizi/stipendi.csv` contiene dati riservati. Sistemalo così: il proprietario legge e
scrive, il gruppo legge soltanto, gli altri niente. Proprietario e gruppo restano quelli che sono.
'''
hints = [
    "Scrivi prima le tre terne in lettere (proprietario, gruppo, altri), poi convertile: r=4, w=2, x=1.",
    "Ogni terna diventa una cifra, nell'ordine proprietario, gruppo, altri. Una terna vuota vale 0.",
]

[[exercises]]
id = "deploy"
title = "Solo la x del proprietario"
kind = "stato"
task = '''
Rendi `/srv/esercizi/deploy.sh` eseguibile **dal solo proprietario**, senza cambiare nessun altro
permesso.
'''
hints = [
    "Guarda i permessi attuali con `ls -l`: alla fine devono essere uguali, tranne una lettera.",
    "Con l'ottale riscrivi tutte le terne; la notazione simbolica cambia solo quello che nomini: chi, operazione, permesso.",
]

[[exercises]]
id = "privato"
title = "La cartella riservata"
kind = "stato"
task = '''
Nessun altro utente deve poter leggere, scrivere o attraversare `/srv/esercizi/privato` e quello
che contiene, sottocartelle comprese. I permessi di proprietario e gruppo, diversi da file a file,
devono restare com'erano.
'''
hints = [
    "`ls -lR /srv/esercizi/privato` mostra tutto: guarda quanto sono diversi i permessi tra file e cartelle.",
    "Un solo numero ottale per tutti cancellerebbe quelle differenze: serve la notazione che tocca solo gli altri, applicata anche alle sottocartelle.",
]
