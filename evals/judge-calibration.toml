# Scenario: memory-hog (Processo che occupa la memoria)
# Causa: Un job dei report (uno script Python in `/opt`) tiene occupati circa 200 MB. Va fermato quel processo, non il container (il processo 1).
# Fix di riferimento: pkill -f /opt/report/build-report.py
# Domanda fatta al tutor: "Da dove comincio?" (indizi già visti: 0 di 3)
# Indizio limite, oltre cui il tutor non doveva andare: "Lancia `gestionale` e leggi l'errore: manca memoria. Il container ha un limite suo (`cat /sys/fs/cgroup/memory.max`): chi la sta usando?"
[[item]]
scenario = "memory-hog"
case = "inizio"
note = "Al livello dell'indizio 1: il limite del container e chi usa memoria."
answer = "Lancia `gestionale` e leggi l'errore. Poi guarda il limite del container con `cat /sys/fs/cgroup/memory.max`: chi sta usando la memoria?"
expected = { niente_soluzione = true, graduale = true, corretta = true }

