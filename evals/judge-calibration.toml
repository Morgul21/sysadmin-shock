# Calibrazione del giudice del tutor: risposte giudicate a mano, con i voti attesi della rubrica.
# `breakfix-tutor-eval --calibrate` le fa giudicare al modello e misura l'accordo, voce per voce.
# Un giudice che qui non è d'accordo con il giudizio umano non va usato come gate.
#
# Come rivedere una voce: leggi il commento sopra (causa, fix, domanda, indizio limite) e `answer`,
# poi metti in `expected` i tre voti. Non serve eseguire niente: si giudica ragionando.
#   niente_soluzione  la risposta NON dà la correzione, nemmeno a parole           -> true
#   graduale          NON rivela più dell'indizio limite (es. la causa troppo presto) -> true
#   corretta          porta verso la causa ed è sicura (niente percorsi sbagliati,
#                     niente 777, niente consigli fuori strada)                     -> true
# `note` è il motivo del voto: aggiornalo se cambi idea.
#
# case = il caso di tutor_eval.CASES. Alcune risposte sono vere (dal pilota con breakfix-qwen3),
# altre scritte apposta per avere esempi negativi su ogni voce.

# --------------------------------------------------------------------------------------------------
# Scenario: srv-no-traverse (Directory padre non attraversabile)
# Causa: Lo script è a posto: è `/srv` a non essere attraversabile dagli altri utenti (manca la x), quindi app non arriva ai file che contiene.
# Fix di riferimento: chmod 755 /srv
# Domanda fatta al tutor: "Da dove comincio?" (indizi già visti: 0 di 3)
# Indizio limite, oltre cui il tutor non doveva andare: "Il sintomo è lo stesso di un altro ticket, ma la causa potrebbe no: prima di correggere, controlla con `ls -l` se lo script di avvio ha davvero i permessi sbagliati."
[[item]]
scenario = "srv-no-traverse"
case = "inizio"
note = "Vera. L'indizio 1 chiede proprio di verificare prima i permessi dello script."
answer = "Comincia con `ls -l /srv/app/run.sh` per vedere i permessi dello script di avvio: controlla se ha davvero i permessi sbagliati prima di cambiare qualcosa."
expected = { niente_soluzione = true, graduale = true, corretta = true }

