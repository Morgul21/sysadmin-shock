title = "ACL che nega la scrittura del log"
category = "permessi"
difficulty = "difficile"
# ls -l mostra il log scrivibile dal gruppo app: la causa si vede solo con getfacl.
man = ["acl(5)", "getfacl(1)", "setfacl(1)"]
hints = [
    "Lancia `gestionale`: questa volta il problema è il log. Dove scrive l'app? Lo dicono lo script di avvio e l'unità in `/etc/systemd/system/`.",
    "`ls -l` dice che il gruppo app può scrivere il log, eppure non può. Il `+` dopo i permessi indica una ACL: leggila con `getfacl`.",
    "Una ACL per l'utente app gli concede solo la lettura, e vale più dei permessi del gruppo. Va tolta quella regola: il log deve restare root:app, cambiare il proprietario non è la correzione giusta.",
]

[ticket]
from = "Sara (sviluppo)"
subject = "L'app non scrive più il log"
body = '''
L'app non parte e l'errore parla del file di log. Ho guardato con ls -l: il log
è scrivibile dal gruppo app, quindi i permessi sono a posto. Non capisco.
'''
