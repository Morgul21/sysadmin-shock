title = "Avvio manuale da root"
category = "permessi"
difficulty = "media"
man = ["chown(1)", "ls(1)", "find(1)"]
hints = [
    "Lancia `gestionale` e leggi l'errore: quale file non riesce a scrivere? Il ticket parla di un avvio fatto a mano: con quale utente?",
    "Guarda il proprietario dei file che l'app scrive (la directory dei dati è nella configurazione): `ls -l`, oppure `find /srv/app -user root` trova quelli di root.",
    "Il file `last-start` è stato creato da un avvio come root ed è rimasto di root: l'utente app non può più sovrascriverlo.",
]

[ticket]
from = "Luca (turno di notte)"
subject = "L'app non riparte dopo il test di stanotte"
body = '''
Stanotte per un test ho lanciato l'app a mano dal mio terminale (ero root) e
funzionava. Stamattina però il servizio non riesce più ad avviarla.
Non ho cambiato niente, giuro.
'''
