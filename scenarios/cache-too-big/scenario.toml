title = "Cache più grande del limite del container"
category = "memoria"
difficulty = "media"
# free mostra la memoria dell'host: il limite vero è nel cgroup del container.
man = ["free(1)", "cgroups(7)", "proc(5)"]
hints = [
    "Lancia `gestionale` e leggi l'errore: quanta memoria chiede l'app? Il ticket dice anche cosa è stato cambiato.",
    "`free` mostra la memoria della macchina, non il limite del container: quello è in `/sys/fs/cgroup/memory.max`. Confrontalo con la cache richiesta nella configurazione dell'app.",
    "La cache chiede 512 MB ma il container ne ha 256 in tutto: va riportata a un valore che ci stia, con margine per il resto.",
]

[ticket]
from = "Andrea (IT)"
subject = "Memoria insufficiente dopo il tuning"
body = '''
Per velocizzare l'app ho alzato un po' la cache nella configurazione. Adesso
non parte più, dice "memoria insufficiente". Ho controllato con free e di
memoria libera ce n'è tantissima, quindi la cache non c'entra.
'''
