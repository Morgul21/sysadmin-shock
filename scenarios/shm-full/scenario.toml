title = "Memoria occupata da un tmpfs"
category = "memoria"
difficulty = "difficile"
# Nessun processo risulta grande: la memoria è nei file di /dev/shm (shmem nel cgroup).
man = ["tmpfs(5)", "df(1)", "cgroups(7)"]
hints = [
    "Lancia `gestionale` e leggi l'errore: manca memoria, ma `ps aux --sort=-rss` non mostra processi grandi.",
    "La memoria può essere occupata anche da file: i filesystem tmpfs vivono in RAM. `df -h` li elenca, e la riga shmem di `/sys/fs/cgroup/memory.stat` dice quanta ne usano.",
    "In `/dev/shm` c'è un file di export da circa 200 MB lasciato da un job: occupa RAM finché esiste.",
]

[ticket]
from = "Sara (sviluppo)"
subject = "Memoria piena ma non si capisce da cosa"
body = '''
L'app non parte per "memoria insufficiente". Ho guardato ps e top: nessun
processo usa più di qualche MB. Ieri sera è anche saltato l'export dei report,
non so se c'entra.
'''
