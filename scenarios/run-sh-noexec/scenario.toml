title = "Script di avvio non eseguibile"
category = "permessi"
difficulty = "facile"
man = ["chmod(1)", "ls(1)", "stat(1)"]
hints = [
    "Lancia `gestionale` e leggi l'errore: quale file viene negato? `cat \"$(which gestionale)\"` ti dice quale script avvia e con quale utente.",
    "Guarda i permessi di quello script con `ls -l` o `stat`: quali bit ha chi lo deve eseguire?",
    "Lo script di avvio si può leggere ma non eseguire: manca il bit di esecuzione. Il 777 del collega lo renderebbe anche scrivibile da tutti: basta il bit che manca.",
]

[ticket]
from = "Giulia (amministrazione)"
subject = "Il gestionale non si apre"
body = '''
Ciao, da stamattina il gestionale non parte più: quando lo avvio esce un errore
che dice "Permission denied". Ieri andava.
Un collega dice che si risolve con un chmod 777 su tutta la cartella, ma io non
ho i permessi per farlo. Ci pensate voi?
'''
