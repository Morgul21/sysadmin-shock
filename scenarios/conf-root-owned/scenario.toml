title = "Configurazione illeggibile"
category = "permessi"
difficulty = "facile"
man = ["chown(1)", "chmod(1)", "stat(1)"]
hints = [
    "Lancia `gestionale` e leggi l'errore: quale file non riesce a leggere? Lo script di avvio (`cat \"$(which gestionale)\"`, poi lo script che chiama) dice dove sta la configurazione.",
    "Guarda proprietario, gruppo e permessi della configurazione con `ls -l`: l'app gira come utente app.",
    "La configurazione è di root e leggibile solo da root. Contiene una password: deve tornare leggibile all'utente app, non a tutti.",
]

[ticket]
from = "Andrea (IT)"
subject = "Dopo il cambio password l'app non parte"
body = '''
Ieri ho aggiornato la password del database in /srv/app/app.conf, l'ho
modificato da root con l'editor. Da allora l'app non parte più.
La password è giusta, l'ho ricontrollata due volte.
'''
